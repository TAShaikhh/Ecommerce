<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  
<defs>
  <style>
    .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #111827; }
    .subtitle { font: 600 18px Arial, Helvetica, sans-serif; fill: #334155; }
    .label { font: 600 16px Arial, Helvetica, sans-serif; fill: #111827; }
    .small { font: 500 13px Arial, Helvetica, sans-serif; fill: #475569; }
    .tiny { font: 500 11px Arial, Helvetica, sans-serif; fill: #64748b; }
  </style>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
  </marker>
</defs>

  <rect width="1800" height="1100" fill="#f8fafc"/>
  <text x="60" y="60" class="title">PrimeBid A3 Deployment Architecture</text>
  <text x="60" y="92" class="small">Docker Compose runtime used for local deployment and demonstration</text>

  <rect x="70" y="180" width="240" height="120" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="125" y="245" class="subtitle">Buyer / Seller</text>
  <text x="100" y="274" class="small">Browser at localhost:3000</text>

  <rect x="360" y="130" width="1320" height="850" rx="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="400" y="185" class="subtitle">Docker Compose Application Stack</text>

  <rect x="410" y="230" width="260" height="120" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <text x="470" y="290" class="label">Frontend Container</text>
  <text x="455" y="320" class="small">Next.js UI :3000</text>

  <rect x="790" y="230" width="260" height="120" rx="22" fill="#eef2ff" stroke="#a5b4fc" stroke-width="3"/>
  <text x="850" y="290" class="label">Gateway Container</text>
  <text x="835" y="320" class="small">REST entry point :8080</text>

  <rect x="440" y="470" width="220" height="110" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <text x="500" y="530" class="label">IAM</text>
  <text x="480" y="558" class="small">Auth, login, reset :8081</text>

  <rect x="700" y="470" width="220" height="110" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <text x="742" y="530" class="label">Catalogue</text>
  <text x="725" y="558" class="small">Items and search :8082</text>

  <rect x="960" y="470" width="220" height="110" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <text x="1015" y="530" class="label">Auction</text>
  <text x="980" y="558" class="small">Bids and results :8083</text>

  <rect x="1220" y="470" width="220" height="110" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <text x="1278" y="530" class="label">Payment</text>
  <text x="1250" y="558" class="small">Checkout and receipt :8084</text>

  <rect x="760" y="680" width="320" height="140" rx="24" fill="#ecfeff" stroke="#67e8f9" stroke-width="3"/>
  <text x="845" y="740" class="label">AI Auto-Bid Subsystem</text>
  <text x="790" y="770" class="small">AutoBidController, AutoBidStore, strategies, polling</text>
  <text x="815" y="798" class="small">Integrated inside the gateway container</text>

  <rect x="1450" y="250" width="250" height="130" rx="24" fill="#ede9fe" stroke="#c4b5fd" stroke-width="3"/>
  <text x="1512" y="315" class="label">Google Gemini API</text>
  <text x="1490" y="345" class="small">External AI service used for</text>
  <text x="1510" y="370" class="small">chat and recommendation logic</text>

  <rect x="1450" y="620" width="250" height="170" rx="24" fill="#fffbeb" stroke="#fcd34d" stroke-width="3"/>
  <text x="1510" y="680" class="label">Persistent Data</text>
  <text x="1490" y="710" class="small">iam/data/*.db</text>
  <text x="1490" y="735" class="small">catalogue/data/*.db</text>
  <text x="1490" y="760" class="small">auction/data/*.db</text>
  <text x="1490" y="785" class="small">payment/data/*.db</text>

  <line x1="310" y1="240" x2="410" y2="290" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="285" y="220" class="small">HTTP UI access</text>

  <line x1="670" y1="290" x2="790" y2="290" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="690" y="270" class="small">Gateway calls</text>

  <line x1="920" y1="350" x2="550" y2="470" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="920" y1="350" x2="810" y2="470" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="920" y1="350" x2="1070" y2="470" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="920" y1="350" x2="1330" y2="470" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="920" y1="350" x2="920" y2="680" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>

  <line x1="1050" y1="290" x2="1450" y2="315" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1150" y="270" class="small">AI prompt / response</text>

  <line x1="660" y1="580" x2="1450" y2="680" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="920" y1="580" x2="1450" y2="710" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1180" y1="580" x2="1450" y2="740" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1440" y1="580" x2="1450" y2="770" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="120" y="910" width="1560" height="80" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="150" y="955" class="small">Deployment notes: the frontend is served at port 3000, all domain traffic flows through the gateway at 8080, and the gateway coordinates the PrimeBid AI flow with the auction service and Gemini while Docker Compose manages the six runtime containers.</text>
</svg>
