<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  
<defs>
  <style>
    .title { font: 700 28px Arial, Helvetica, sans-serif; fill: #111827; }
    .subtitle { font: 600 18px Arial, Helvetica, sans-serif; fill: #334155; }
    .label { font: 600 16px Arial, Helvetica, sans-serif; fill: #111827; }
    .small { font: 500 13px Arial, Helvetica, sans-serif; fill: #475569; }
    .tiny { font: 500 11px Arial, Helvetica, sans-serif; fill: #64748b; }
  </style>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
  </marker>
</defs>

  <rect width="1800" height="1100" fill="#f8fafc"/>
  <text x="60" y="60" class="title">PrimeBid A3 Component Architecture</text>
  <text x="60" y="92" class="small">Frontend UI, gateway orchestration, microservices, and Gemini-assisted auto-bid flow</text>

  <rect x="50" y="140" width="460" height="800" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="80" y="190" class="subtitle">Next.js Frontend</text>
  <rect x="80" y="230" width="400" height="110" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="105" y="275" class="label">Auth and Entry UI</text>
  <text x="105" y="303" class="small">Home, Login, Signup, Navbar, Session state</text>
  <rect x="80" y="370" width="400" height="140" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="105" y="415" class="label">Catalogue and Item Detail</text>
  <text x="105" y="443" class="small">Catalogue list, search, detail page, live bid UI</text>
  <text x="105" y="468" class="small">Auction state transitions and bid history rendering</text>
  <rect x="80" y="540" width="400" height="140" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="105" y="585" class="label">PrimeBid AI Assistant</text>
  <text x="105" y="613" class="small">Chat panel, budget input, AI recommendation action</text>
  <text x="105" y="638" class="small">Auto-bid status polling and stop control</text>
  <rect x="80" y="710" width="400" height="110" rx="18" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <text x="105" y="755" class="label">Payment and Receipt UI</text>
  <text x="105" y="783" class="small">Checkout, expiry validation, receipt confirmation</text>
  <rect x="80" y="850" width="400" height="60" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="105" y="888" class="label">Zustand Auth Store and fetchApi client</text>

  <rect x="660" y="140" width="520" height="800" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="690" y="190" class="subtitle">Gateway API Layer</text>
  <rect x="690" y="230" width="460" height="90" rx="18" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <text x="715" y="275" class="label">AuthProxyController and SessionStore</text>
  <text x="715" y="300" class="small">Token validation, current user, protected-route enforcement</text>
  <rect x="690" y="350" width="460" height="90" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="715" y="395" class="label">Catalogue, Bid, Payment, and Auction Proxies</text>
  <text x="715" y="420" class="small">REST/HATEOAS-style forwarding to domain services</text>
  <rect x="690" y="470" width="460" height="210" rx="18" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="715" y="515" class="label">AutoBidController</text>
  <text x="715" y="543" class="small">/auto-bid/chat, /start, /status/{sessionId}, /stop/{sessionId}</text>
  <text x="715" y="568" class="small">Validates auth, seller restrictions, budget, and auction activity</text>
  <text x="715" y="593" class="small">Creates and manages auto-bid sessions for the frontend</text>
  <rect x="720" y="620" width="190" height="40" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="740" y="646" class="small">AutoBidStore</text>
  <rect x="930" y="620" width="190" height="40" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="948" y="646" class="small">GenAiAdvisor</text>
  <rect x="690" y="710" width="460" height="90" rx="18" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="715" y="755" class="label">Scheduler and Strategy Engine</text>
  <text x="715" y="780" class="small">Conservative, Aggressive, Sniper auto-bid strategies</text>
  <rect x="690" y="830" width="460" height="80" rx="18" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="715" y="875" class="label">Error and fallback handling</text>
  <text x="715" y="900" class="small">Graceful UI-safe responses when Gemini or downstream services fail</text>

  <rect x="1320" y="140" width="420" height="800" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1350" y="190" class="subtitle">Domain Services and External AI</text>
  <rect x="1350" y="230" width="360" height="70" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1380" y="273" class="label">IAM Service</text>
  <rect x="1350" y="325" width="360" height="70" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1380" y="368" class="label">Catalogue Service</text>
  <rect x="1350" y="420" width="360" height="70" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1380" y="463" class="label">Auction Service</text>
  <rect x="1350" y="515" width="360" height="70" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1380" y="558" class="label">Payment Service</text>
  <rect x="1350" y="620" width="360" height="120" rx="16" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
  <text x="1380" y="665" class="label">Google Gemini API</text>
  <text x="1380" y="693" class="small">Natural-language strategy reasoning and action suggestion</text>
  <rect x="1350" y="770" width="360" height="110" rx="16" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="1380" y="815" class="label">SQLite-backed local persistence</text>
  <text x="1380" y="843" class="small">Each microservice maintains local runtime data</text>

  <line x1="510" y1="430" x2="660" y2="430" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="540" y="410" class="small">REST requests</text>
  <line x1="510" y1="610" x2="660" y2="610" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="522" y="590" class="small">AI chat and auto-bid control</text>

  <line x1="1180" y1="275" x2="1320" y2="265" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1180" y1="390" x2="1320" y2="360" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1180" y1="565" x2="1320" y2="455" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1180" y1="565" x2="1320" y2="550" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1120" y1="640" x2="1350" y2="680" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1165" y="660" class="small">prompt + structured reply</text>

  <rect x="60" y="980" width="1680" height="70" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="90" y="1024" class="small">Legend: Blue boxes = standard UI/service flow, Teal = AI-specific UI and orchestration, Green = validated business flow, Purple arrow = Gemini integration, Red = error/fallback path.</text>
</svg>
